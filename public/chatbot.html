<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chat</title>
    <style>
      :root {
        --primary: #0ea5e9;
        --primary-fg: #ffffff;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --bubble-user-bg: var(--primary);
        --bubble-user-fg: var(--primary-fg);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 14px 16px;
        background: var(--primary);
        color: var(--primary-fg);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      header .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 2px rgba(255,255,255,.3); }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
      .msg.bot { background: #f1f5f9; color: var(--fg); align-self: flex-start; border-bottom-left-radius: 4px; }
      .msg.user { background: var(--bubble-user-bg); color: var(--bubble-user-fg); align-self: flex-end; border-bottom-right-radius: 4px; }
      .typing { display: inline-flex; gap: 4px; padding: 12px 14px; background: #f1f5f9; border-radius: 14px; align-self: flex-start; }
      .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: b 1.2s infinite; }
      .typing span:nth-child(2) { animation-delay: .15s }
      .typing span:nth-child(3) { animation-delay: .3s }
      @keyframes b { 0%,80%,100% { opacity:.3; transform: translateY(0) } 40% { opacity:1; transform: translateY(-3px) } }
      form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); flex-shrink: 0; background: var(--bg); }
      input { flex: 1; padding: 11px 14px; border: 1px solid var(--border); border-radius: 999px; outline: none; font-size: 14px; font-family: inherit; }
      input:focus { border-color: var(--primary); }
      button { padding: 0 16px; border: 0; background: var(--primary); color: var(--primary-fg); border-radius: 999px; font-weight: 600; cursor: pointer; font-size: 14px; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .footer { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 0 8px; }
      .lead-toast { background: #dcfce7; color: #166534; padding: 8px 14px; border-radius: 10px; font-size: 13px; align-self: center; }
      /* Proactive badge inside chat */
      .proactive-badge {
        align-self: center;
        background: linear-gradient(135deg, var(--primary), var(--primary));
        color: var(--primary-fg);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .04em;
        opacity: .9;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <header><span class="dot"></span><span id="title">Chat</span></header>
    <div id="log"></div>
    <form id="form">
      <input id="input" placeholder="Type your message..." autocomplete="off" required />
      <button type="submit" id="send">Send</button>
    </form>
    <div class="footer">Powered by SkyLead</div>

    <script>
      const params = new URLSearchParams(location.search);
      const WORKSPACE = params.get("w");
      const SUPABASE_URL = "https://dsxqhplhjyxsmiwxbmcd.supabase.co";
      const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzeXFocGxoanl4c21pd3hibWNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTI2MjgsImV4cCI6MjA5NDMyODYyOH0.d4xWRBb_2lnNqQrvpwP3H9uR01qM9h6dvjmQj3Z9Lks";
      const ENDPOINT = SUPABASE_URL + "/functions/v1/chatbot-chat";

      const greeting = decodeURIComponent(params.get("g") || "Hi! How can I help?");
      const title = decodeURIComponent(params.get("t") || "Chat");
      const proactiveMsg = decodeURIComponent(params.get("p") || "");
      const color = "#" + (params.get("c") || "0EA5E9").replace(/^#/, "");
      document.documentElement.style.setProperty("--primary", color);
      document.getElementById("title").textContent = title;

      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");

      const STORAGE = "sl_chat_" + WORKSPACE;
      let state = JSON.parse(localStorage.getItem(STORAGE) || "{}");
      if (!state.visitor_id) state.visitor_id = crypto.randomUUID();

      function persist() { localStorage.setItem(STORAGE, JSON.stringify(state)); }
      function add(role, text) {
        const d = document.createElement("div");
        d.className = "msg " + (role === "user" ? "user" : "bot");
        d.textContent = text;
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
      }
      function addToast(text) {
        const d = document.createElement("div");
        d.className = "lead-toast";
        d.textContent = "✓ " + text;
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
      }
      function addProactiveBadge() {
        const d = document.createElement("div");
        d.className = "proactive-badge";
        d.textContent = "New message";
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
      }

      // Replay history if exists
      if (state.history && state.history.length) {
        state.history.forEach(m => add(m.role, m.content));
      } else {
        // Normal first visit: show greeting
        add("bot", greeting);
        state.history = [{ role: "bot", content: greeting }];
        // If proactive message is present and this is a fresh session, inject it as a follow-up
        if (proactiveMsg && proactiveMsg !== greeting) {
          setTimeout(() => {
            addProactiveBadge();
            add("bot", proactiveMsg);
            state.history.push({ role: "bot", content: proactiveMsg });
            persist();
          }, 800);
        }
        persist();
      }

      let typingEl = null;
      function showTyping() {
        typingEl = document.createElement("div");
        typingEl.className = "typing";
        typingEl.innerHTML = "<span></span><span></span><span></span>";
        log.appendChild(typingEl);
        log.scrollTop = log.scrollHeight;
      }
      function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || !WORKSPACE) return;
        input.value = "";
        add("user", text);
        state.history.push({ role: "user", content: text });
        persist();
        send.disabled = true;
        showTyping();
        try {
          const res = await fetch(ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json", apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY },
            body: JSON.stringify({
              workspace_id: WORKSPACE,
              visitor_id: state.visitor_id,
              conversation_id: state.conversation_id,
              message: text,
              source_url: document.referrer || location.href,
              user_agent: navigator.userAgent,
            }),
          });
          const data = await res.json();
          hideTyping();
          if (!res.ok) {
            add("bot", data.error || "Something went wrong. Please try again.");
            return;
          }
          state.conversation_id = data.conversation_id;
          add("bot", data.reply);
          state.history.push({ role: "bot", content: data.reply });
          if (data.lead_captured) addToast("Thanks — we've got your info!");
          persist();
        } catch (err) {
          hideTyping();
          add("bot", "Network error. Please try again.");
        } finally {
          send.disabled = false;
          input.focus();
        }
      });

      input.focus();
    </script>
  </body>
</html>
